<body>
  <section class="bench"><div><div class="overline">Putaran kedua · tiga mekanisme baru</div><h1>Another way to turn a page.</h1><p>Sentuh pita, buka sudut kertas, atau pilih benda kecilnya. Semua konsep bisa dicoba sampai akhir cerita; ini masih preview terpisah.</p></div><nav class="choices" aria-label="Ganti konsep"><button data-concept="d">D · Pita kenangan</button><button data-concept="e">E · Balik lembar</button><button data-concept="f">F · Benda pengantar</button></nav></section>
  <p class="notes" id="notes"></p>
  <div class="shell"><main class="story" id="story" data-concept="d" data-chapter="2" aria-label="Preview navigasi cerita">
    <header class="brand-bar"><div class="brand">a little universe <em>for you.</em></div><button class="index-trigger" id="index-trigger" aria-expanded="false" aria-controls="contents" aria-label="Buka daftar isi"><span class="index-label">halaman-halaman kecil</span><span class="tiny-lines" aria-hidden="true"><i></i><i></i></span></button></header>

    <div class="transition-layer" id="transition-layer" aria-hidden="true"></div>
  </main></div>
  <script>
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>';

    const chapters=[
      {name:'Hari lahirmu',short:'Hari lahir',eyebrow:'Untuk hari ketika dunia mengenalmu',title:'Hari ketika dunia<br><em>mendapatmu.</em>',body:'Ada hari yang biasa saja.\nLalu ada hari ketika kamu lahir,\ndan dunia mendapat satu alasan lagi\nuntuk terasa indah.',note:'the universe got lucky.',art:'rose'},
      {name:'Bunga & doa',short:'Bunga',eyebrow:'Sesuatu yang ingin kutitipkan',title:'Yang baik,<br><em>semoga tinggal.</em>',body:'Semoga langkahmu ringan.\nSemoga hatimu menemukan tenang.\nDan di antara semua yang datang,\nsemoga cinta selalu memilih tinggal.',note:'may good things find you.',art:'tulip'},
      {name:'Bait untukmu',short:'Puisi',eyebrow:'Ada yang hanya bisa kutulis',title:'Barangkali,<br>kamu adalah<br><em>pulang.</em>',body:'Di antara segala yang bergerak,\nada hal yang ingin kutetapkan:\ncaramu membuat dunia\nterasa lebih pelan.',note:'some words, only for you.',art:'anemone'},
      {name:'Tiup lilin',short:'Lilin',eyebrow:'Satu harapan, pelan-pelan',title:'Pejamkan mata.<br><em>Minta yang indah.</em>',body:'Tak perlu buru-buru.\nAda sebuah harapan yang menunggumu.\nSemoga yang kamu minta\nmenemukan jalannya.',note:'make a little wish.',art:'rose'},
      {name:'Surat untukmu',short:'Surat',eyebrow:'Dan ini, yang belum sempat kusampaikan',title:'Jadi, ini suratku.<br><em>Untukmu.</em>',body:'Terima kasih sudah lahir.\nSudah tumbuh. Sudah menjadi kamu.\nBahkan pada hari-hari ketika menjadi\ndiri sendiri terasa tidak mudah.\n\nSemoga kamu tak pernah lupa:\nada yang bersyukur karena kamu ada.',note:'with all the love, always.',art:'rose'}
    ];
    const hints={d:'<strong>D · Pita kenangan.</strong> Pita di tepi buku menjadi penanda menuju bab selanjutnya. Sentuh atau tarik sedikit ke bawah. Bab berikutnya tertulis pada pitanya.',e:'<strong>E · Balik lembar.</strong> Sudut kertas yang terlipat mengundang untuk membuka halaman berikutnya. Sentuh sudutnya; lembar akan terangkat dan berbalik.',f:'<strong>F · Benda pengantar.</strong> Bab selanjutnya diwakili benda yang berbeda: bunga, catatan, lilin, atau amplop. Sentuh bendanya untuk meneruskan cerita.'};
    const invitations=['Ada bunga\nuntukmu.','Kutulis sesuatu\nuntukmu.','Buat satu\nharapan.','Masih ada\nsuratku.','Kita baca\nsekali lagi?'];
    const cornerLabels=['Ada bunga\nuntukmu','Beberapa bait\nuntukmu','Satu harapan\nuntukmu','Surat terakhir\nuntukmu','Dari awal,\nsekali lagi'];
    const params=new URLSearchParams(location.search);let concept=['d','e','f'].includes(params.get('concept'))?params.get('concept'):'d';let chapter=2;let busy=false;let sequence=0;let ignoreClickUntil=0;
    if(params.get('capture')==='1')document.documentElement.classList.add('capture');
    const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
    const nextIndex=()=>chapter===4?0:chapter+1;
    function figure(){if(chapter===1)return '<figure class="garden-figure"><div class="botanicals"><img src="assets/botanical-rose.webp" alt="Mawar"><img src="assets/botanical-tulip.webp" alt="Tulip"><img src="assets/botanical-anemone.webp" alt="Anemone"></div><p>tiga bunga. tiga doa.</p></figure>';if(chapter===3)return '<figure class="candle-figure"><span class="candle-flame"></span><span class="candle-body"></span><span class="base"></span><p>Semoga yang indah datang pelan-pelan.</p></figure>';return `<figure class="page-figure"><div class="polaroid"><div class="photo-placeholder"><i class="photo-sun"></i><span>kamu, di suatu sore.</span></div><figcaption class="photo-caption">a moment worth keeping.</figcaption></div><img class="pressed-flower" src="assets/botanical-${chapters[chapter].art}.webp" alt="Bunga ${chapters[chapter].art}"><span class="figure-note">hari yang ingin kuulang.</span></figure>`}
    function object(){switch(chapter){case 0:return '<span class="object flower-object"><img src="assets/romantic-roses.webp" alt=""></span>';case 1:return '<span class="object note-object"><span class="note-writing">ada bait<br>yang menyimpan<br>namamu.</span></span>';case 2:return '<span class="object candle-object"><span class="candle-flame"></span><span class="candle-body"></span></span>';case 3:return '<span class="object envelope-object"><span class="seal">a.</span></span>';default:return '<span class="object star-object"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8Z"/></svg></span>'}}
    function render(){const c=chapters[chapter],n=chapters[nextIndex()];$('#story').dataset.concept=concept;$('#story').dataset.chapter=chapter;$('#notes').innerHTML=hints[concept];$$('button[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===concept)));$('#spread').innerHTML=`<section class="page-copy"><span class="chapter-overline">${c.eyebrow}</span><h2 tabindex="-1">${c.title}</h2><div class="poem">${c.body.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div><p class="hand-note">${c.note}</p></section>${figure()}`;$('#back').innerHTML=back+'<span>halaman sebelumnya</span>';$('#back').disabled=chapter===0;$('#chapter-counter').textContent=`${String(chapter+1).padStart(2,'0')} / 05 · ${c.name}`;$('#ribbon-nav').hidden=concept!=='d';$('#corner-nav').hidden=concept!=='e';$('#keepsake-nav').hidden=concept!=='f';const label=chapter===4?'Baca cerita dari awal':`Buka ${n.name}`;$('#ribbon-nav').innerHTML=concept==='d'?`<button class="ribbon-button" data-next aria-label="${label}"><span class="ribbon-number">${String(nextIndex()+1).padStart(2,'0')}</span><span class="ribbon-title"><small>${chapter===4?'Sekali lagi':'Selanjutnya'}</small>${n.short}</span><span class="ribbon-arrow" aria-hidden="true">↓</span></button><span class="ribbon-whisper">sentuh pita ini<svg viewBox="0 0 45 45"><path d="M2 38Q30 42 30 8m-7 5 7-6 5 8"/></svg></span>`:'';$('#corner-nav').innerHTML=concept==='e'?`<span class="corner-hintline">balik lembar ini</span><button class="corner-button" data-next aria-label="${label}"><span class="corner-label">${cornerLabels[chapter].replace('\n','<br>')}</span><span class="corner-hint">${chapter===4?'KEMBALI KE AWAL':`${String(nextIndex()+1).padStart(2,'0')} · ${n.name.toUpperCase()}`}</span>${arrow}</button>`:'';$('#keepsake-nav').innerHTML=concept==='f'?`<button class="keepsake-button" data-next aria-label="${label}"><span class="keepsake-caption">${invitations[chapter].replace('\n','<br>')}<small>${chapter===4?'sentuh bintangnya':chapter===0?'sentuh bunganya':chapter===1?'buka catatannya':chapter===2?'sentuh lilinnya':'buka amplopnya'}</small></span>${object()}</button>`:'';$('#chapter-choices').innerHTML=chapters.map((x,i)=>`<button class="chapter-choice" data-go="${i}" ${chapter===i?'aria-current="step"':''}><span>0${i+1}</span>${x.name}</button>`).join('');}
    function closeIndex(restore=false){$('#contents').hidden=true;$('#index-trigger').setAttribute('aria-expanded','false');if(restore)$('#index-trigger').focus()}
    function commit(index){chapter=index;closeIndex();render();$('#reading-window').scrollTop=0;$('.page-copy h2').focus({preventScroll:true});}
    async function travel(index,source){if(busy)return;busy=true;const token=++sequence;const oldConcept=concept;const layer=$('#transition-layer');const title=chapters[index].short;try{if(reduce()){commit(index);return}if(oldConcept==='e'){layer.innerHTML=`<div class="page-leaf"><span class="leaf-title">${title}</span></div>`;const leaf=$('.page-leaf');await leaf.animate([{transform:'perspective(1800px) rotateY(-100deg)',opacity:0},{transform:'perspective(1800px) rotateY(0deg)',opacity:1}],{duration:370,easing:'cubic-bezier(.3,.1,.25,1)',fill:'forwards'}).finished;if(token!==sequence)return;commit(index);await leaf.animate([{transform:'perspective(1800px) rotateY(0deg)',opacity:1},{transform:'perspective(1800px) rotateY(95deg)',opacity:.2}],{duration:620,easing:'cubic-bezier(.35,0,.2,1)',fill:'forwards'}).finished;}else if(oldConcept==='d'){const ribbon=$('.ribbon-button');await ribbon?.animate([{transform:'translateY(0)'},{transform:'translateY(28px)'}],{duration:170,fill:'forwards',easing:'ease-out'}).finished;layer.innerHTML=`<div class="ribbon-wash">${title}</div>`;const wash=$('.ribbon-wash');await wash.animate([{opacity:0,transform:'translateY(-12%)'},{opacity:1,transform:'translateY(0)'}],{duration:330,fill:'forwards',easing:'ease-in-out'}).finished;if(token!==sequence)return;commit(index);await wash.animate([{opacity:1},{opacity:0}],{duration:520,fill:'forwards',easing:'ease-out'}).finished;}else{const objectElement=source?.querySelector('.object');layer.innerHTML='<div class="object-wash"></div>';const wash=$('.object-wash');if(objectElement)objectElement.animate([{transform:'rotate(5deg) scale(1)'},{transform:'rotate(-5deg) scale(1.15)',opacity:.25}],{duration:450,fill:'forwards',easing:'ease-in-out'});await wash.animate([{opacity:0},{opacity:1}],{duration:400,fill:'forwards',easing:'ease-in-out'}).finished;if(token!==sequence)return;commit(index);await wash.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards',easing:'ease-out'}).finished;$('#spread').animate([{opacity:.5,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:450,easing:'ease-out'});} }catch(error){if(error.name!=='AbortError')console.error(error)}finally{if(token===sequence){layer.replaceChildren();busy=false;}}}
    let pull=null;
    document.addEventListener('pointerdown',e=>{const ribbon=e.target.closest('.ribbon-button');if(!ribbon||busy)return;pull={y:e.clientY,dy:0,ribbon};ribbon.setPointerCapture(e.pointerId)});

    document.addEventListener('pointercancel',()=>{if(pull)pull.ribbon.style.transform='';pull=null});
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||busy)return;if(b.dataset.concept){++sequence;concept=b.dataset.concept;closeIndex();render();$('#reading-window').scrollTop=0;return}if(b.dataset.next!==undefined){if(performance.now()<ignoreClickUntil){ignoreClickUntil=0;return}travel(nextIndex(),b);return}if(b.id==='back'){travel(chapter-1,b);return}if(b.id==='index-trigger'){const open=$('#contents').hidden;$('#contents').hidden=!open;b.setAttribute('aria-expanded',String(open));if(open)$('#contents-close').focus();return}if(b.id==='contents-close'){closeIndex(true);return}if(b.dataset.go!==undefined){commit(Number(b.dataset.go));}});
