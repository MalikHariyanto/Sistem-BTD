    if(params.get('capture')==='1')document.documentElement.classList.add('capture');
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const notes={a:'<strong>Rekomendasi · A: Penanda cerita.</strong> Satu tombol lanjut yang paling menonjol, tujuan tertulis jelas, dan daftar isi yang bisa dibuka bila diperlukan. Tombol kembali tetap mudah ditemukan.',b:'<strong>B: Pita lima bab.</strong> Semua nama bab langsung terlihat dan bisa disentuh. Cocok untuk yang suka kembali ke bagian favorit, dengan sedikit lebih banyak elemen di layar.',c:'<strong>C: Undangan di akhir.</strong> Halaman terasa seperti surat yang dibaca pelan-pelan. Tombol lanjut muncul di ujung bacaan, tanpa bilah bawah yang selalu menempel. Bab panjang perlu digulir sampai akhir.'};
    function flowerContent(){return `<div class="garden"><div class="flowers" aria-label="Pilih sebuah bunga">${wishes.map((w,i)=>`<button class="flower" data-wish="${i}" aria-pressed="${i===wish}" aria-label="Baca doa ${w.name}"><img src="assets/botanical-${w.art}.webp" alt="Ilustrasi ${w.flower}" width="512" height="768"><span class="flower-name">${w.flower}</span><b>${w.name}</b><span class="touch-label">${i===wish?'Doanya terbuka':'Sentuh untuk membaca'}</span></button>`).join('')}</div><div class="wish" aria-live="polite"><h3>${wishes[wish].title}</h3><p>${wishes[wish].text}</p></div></div>`}
    function chapterContent(){if(chapter===1)return flowerContent();if(chapter===0)return `<div class="photo-collage" aria-label="Contoh bingkai yang nanti berisi foto pribadi"><div class="polaroid"><span>✧<small>hari paling istimewa</small></span></div><div class="polaroid"><span>✧<small>sebuah kenangan kita</small></span></div><img class="collage-flower" src="assets/romantic-roses.webp" alt="Rangkaian mawar" width="512" height="768"></div>`;if(chapter===2)return '<div class="reading"><h3>Rumah yang tidak beralamat</h3><p>Barangkali rumah bukan tempat,<br>melainkan seseorang<br>yang membuat segala lelah<br>ingin pulang.</p><p>Dan sejak mengenalmu,<br>aku tak lagi bertanya<br>ke mana.</p><p class="sample-note">Contoh satu bait untuk mencoba navigasi. Pilihan puisi di web utama tetap terpisah dari tombol pindah bab.</p></div>';if(chapter===3)return '<div class="candle"><span class="flame"></span><span class="wax"></span><p>Semoga yang kamu minta, menemukan jalannya.</p></div>';return '<div class="reading"><h3>Selamat ulang tahun, kamu.</h3><p>Terima kasih sudah lahir. Sudah tumbuh. Sudah menjadi kamu, bahkan pada hari-hari ketika menjadi diri sendiri terasa tidak mudah.</p><p>Semoga kamu tak pernah lupa: ada yang bersyukur karena kamu ada.</p><p class="signature">Dengan seluruh rasa,<br>aku.</p></div>'}
    const nextLabel=()=>chapter===4?'Baca cerita dari awal':`Lanjut ke ${chapters[chapter+1].short.toLowerCase()}`;
    const nextButton=(cls='next-primary')=>`<button class="${cls}" data-action="next">${nextLabel()}${svg('arrow')}</button>`;
    const backButton=()=>`<button class="quiet-back" data-action="back" ${chapter===0?'disabled':''}>${svg('back')}<span>Kembali</span></button>`;
    function invitation(){const phrases=['Masih ada bunga untukmu.','Ada bait yang menyimpanmu.','Sekarang, buat satu harapan.','Masih ada surat untukmu.','Cerita ini selalu untukmu.'];return `<nav class="invitation" aria-label="Lanjut setelah membaca"><span class="eyebrow">${chapter===4?'Akhir cerita':`Selanjutnya · ${String(chapter+2).padStart(2,'0')} / 05`}</span><h3>${phrases[chapter]}</h3>${nextButton()}${backButton()}</nav>`}
    function render(animate=false){const oldFocus=document.activeElement;const oldWish=oldFocus?.dataset.wish;const c=chapters[chapter];$('#story').dataset.option=option;$('#story').dataset.chapter=chapter;$('#mode-note').innerHTML=notes[option];$$('[data-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.option===option));$('#header-menu').hidden=option==='b';$('#header-caption').hidden=option!=='b';$('#header-menu').innerHTML=`<span>${chapter+1}/5 · ${option==='a'?'Isi cerita':'Bab'}</span>${svg('list')}`;$('#ribbon').hidden=option!=='b';$('#ribbon').innerHTML=chapters.map((x,i)=>`<button data-go="${i}" ${i===chapter?'aria-current="step"':''} aria-label="Ke ${x.name}">${svg(x.icon)}<span>${x.short}</span></button>`).join('');$('#content-wrap').innerHTML=`<article class="spread"><div class="chapter-title"><span class="eyebrow">${c.eyebrow}</span><h2 tabindex="-1">${c.title}</h2><p>${c.intro}</p><div class="flourish" aria-hidden="true">✧</div></div>${chapterContent()}</article>${option==='c'?invitation():''}`;$('#footer').hidden=option==='c';if(option==='c')$('#footer').replaceChildren();if(option==='a')$('#footer').innerHTML=`<div class="dock">${backButton()}<span class="current-position">${String(chapter+1).padStart(2,'0')} / 05 · ${c.name}</span><button class="next-primary" data-action="next"><span class="next-copy"><small>${chapter===4?'Setiap saat, untukmu':`Bab berikutnya · ${String(chapter+2).padStart(2,'0')} / 05`}</small><strong>${nextLabel()}</strong></span>${svg('arrow')}</button></div>`;if(option==='b')$('#footer').innerHTML=`<div class="ribbon-footer">${backButton()}<span class="ribbon-position">${String(chapter+1).padStart(2,'0')} / 05</span>${nextButton('next-outline')}</div>`;$('#contents-panel').innerHTML=`<h3>Halaman-halaman kecil.</h3><p class="menu-help">Pilih bagian yang ingin kamu baca.</p><button class="menu-close" data-action="close" aria-label="Tutup daftar isi">${svg('close')}</button>${chapters.map((x,i)=>`<button data-go="${i}" ${i===chapter?'aria-current="step"':''}><span class="num">0${i+1}</span>${svg(x.icon)}${x.name}</button>`).join('')}`;if(animate){$('#content-wrap').classList.remove('appearing');void $('#content-wrap').offsetWidth;$('#content-wrap').classList.add('appearing')}if(oldWish!==undefined)$(`[data-wish="${oldWish}"]`)?.focus({preventScroll:true});}
    function closeMenu(restore=false){$('#contents-panel').hidden=true;$$('[aria-controls="contents-panel"]').forEach(b=>b.setAttribute('aria-expanded','false'));if(restore)$('#header-menu')?.focus()}
    function go(index){chapter=Math.max(0,Math.min(4,index));closeMenu();render(true);$('#story-scroll').scrollTop=0;$('.chapter-title h2').focus({preventScroll:true});}
    function toggleMenu(){const open=$('#contents-panel').hidden;$('#contents-panel').hidden=!open;$$('[aria-controls="contents-panel"]').forEach(b=>b.setAttribute('aria-expanded',String(open)));if(open)$('#contents-panel button[data-go]').focus()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('#contents-panel'))closeMenu();return}if(b.dataset.option){option=b.dataset.option;closeMenu();render();$('#story-scroll').scrollTop=0;return}if(b.dataset.go!==undefined){go(Number(b.dataset.go));return}if(b.dataset.wish!==undefined){const scroll=$('#story-scroll').scrollTop;wish=Number(b.dataset.wish);closeMenu();render();$('#story-scroll').scrollTop=scroll;return}if(b.id==='header-menu'||b.dataset.action==='menu'){toggleMenu();return}if(b.dataset.action==='close'){closeMenu(true);return}if(b.dataset.action==='next')go(chapter===4?0:chapter+1);if(b.dataset.action==='back')go(chapter-1)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu(true)});
    render();
  </script>
</body>
</html>
