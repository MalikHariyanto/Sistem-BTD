    *{box-sizing:border-box}body{margin:0;background:#eee9df;color:#382e26;font-family:Sans,Arial,sans-serif;font-size:14px}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,summary:focus-visible{outline:2px solid #92714f;outline-offset:4px}button:disabled{cursor:default;opacity:.3}button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button[hidden],[hidden]{display:none!important}

    const nextLabel=()=>chapter===4?'Baca cerita dari awal':`Lanjut ke ${chapters[chapter+1].short.toLowerCase()}`;
    const nextButton=(cls='next-primary')=>`<button class="${cls}" data-action="next">${nextLabel()}${svg('arrow')}</button>`;
    const backButton=()=>`<button class="quiet-back" data-action="back" ${chapter===0?'disabled':''}>${svg('back')}<span>Kembali</span></button>`;
    function invitation(){const phrases=['Masih ada bunga untukmu.','Ada bait yang menyimpanmu.','Sekarang, buat satu harapan.','Masih ada surat untukmu.','Cerita ini selalu untukmu.'];return `<nav class="invitation" aria-label="Lanjut setelah membaca"><span class="eyebrow">${chapter===4?'Akhir cerita':`Selanjutnya · ${String(chapter+2).padStart(2,'0')} / 05`}</span><h3>${phrases[chapter]}</h3>${nextButton()}${backButton()}</nav>`}

    function closeMenu(restore=false){$('#contents-panel').hidden=true;$$('[aria-controls="contents-panel"]').forEach(b=>b.setAttribute('aria-expanded','false'));if(restore)$('#header-menu')?.focus()}
    function go(index){chapter=Math.max(0,Math.min(4,index));closeMenu();render(true);$('#story-scroll').scrollTop=0;$('.chapter-title h2').focus({preventScroll:true});}
    function toggleMenu(){const open=$('#contents-panel').hidden;$('#contents-panel').hidden=!open;$$('[aria-controls="contents-panel"]').forEach(b=>b.setAttribute('aria-expanded',String(open)));if(open)$('#contents-panel button[data-go]').focus()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('#contents-panel'))closeMenu();return}if(b.dataset.option){option=b.dataset.option;closeMenu();render();$('#story-scroll').scrollTop=0;return}if(b.dataset.go!==undefined){go(Number(b.dataset.go));return}if(b.dataset.wish!==undefined){const scroll=$('#story-scroll').scrollTop;wish=Number(b.dataset.wish);closeMenu();render();$('#story-scroll').scrollTop=scroll;return}if(b.id==='header-menu'||b.dataset.action==='menu'){toggleMenu();return}if(b.dataset.action==='close'){closeMenu(true);return}if(b.dataset.action==='next')go(chapter===4?0:chapter+1);if(b.dataset.action==='back')go(chapter-1)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu(true)});
    render();
  </script>
</body>
</html>
