  <style>

    nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
    a { color: #e8d8b0; text-underline-offset: 4px; }

<body>
  <main>
    <h1>Tiga pilihan cakram foto Gargantua</h1>
    <p>Ini ilustrasi konsep untuk memilih arah visual, bukan rekaman animasi final. Foto di dalam gambar adalah ilustrasi. Preview ini terpisah dari web ulang tahun.</p>
    <nav aria-label="Unduh preview">
      <a href="preview.png" download="preview-gargantua-abc.png">Unduh gambar PNG</a>
      <a href="preview.png" target="_blank" rel="noopener">Buka ukuran penuh</a>

    <figure>
      <img src="preview.png" alt="Tiga konsep Gargantua, dari atas: A, cakram padat dengan foto dekat yang jelas; B, fokus foto mengikuti perjalanan kamera; C, anyaman thumbnail foto yang lebih rapat.">
      <figcaption><strong>A — Padat, tetap jernih (rekomendasi).</strong> Jauh menjadi filamen, dekat terbaca sebagai foto.<br><strong>B — Fokus yang mengalir.</strong> Foto bergantian jelas mengikuti perjalanan kamera.<br><strong>C — Anyaman foto.</strong> Lebih banyak foto terbaca dengan susunan yang lebih teratur.</figcaption>
    </figure>
